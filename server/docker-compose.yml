services:
  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: salamanders_builds
      POSTGRES_USER: salamanders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Only runs on a genuinely empty data volume — safe to leave mounted;
      # re-running docker compose up doesn't re-apply it against real data.
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U salamanders -d salamanders_builds']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8787
      # The API connects as the data-only role, never the owner. Create it once
      # with app-role.sql (see README, "Database roles").
      DATABASE_URL: postgres://salamanders_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in server/.env, then run app-role.sql}@db:5432/salamanders_builds
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      # Member reports. Role ids default in code (XVIIILegion / Reclusiarch).
      # The webhook URL is a secret: server/.env only, never committed.
      REPORTER_ROLE_ID: ${REPORTER_ROLE_ID:-}
      RECLUSIARCH_ROLE_ID: ${RECLUSIARCH_ROLE_ID:-}
      REPORTS_WEBHOOK_URL: ${REPORTS_WEBHOOK_URL:-}
      # Legion Archive gate. ARCHIVE_KEY is the base64 key from
      # archive-export/.env (keep a copy in a password manager).
      ARCHIVE_KEY: ${ARCHIVE_KEY:-}
      # The guild's member role, not only the archive's: it gates the archive key,
      # answers GET /membership and sets the member flag on the builds list, so
      # narrowing it changes who counts as a member across the site.
      ARCHIVE_ROLE_ID: ${ARCHIVE_ROLE_ID:-1377787723976409211}
      # Perk corrections: wiki bake location and editor/moderator role
      # overrides; empty means the built-in defaults (bake.js, privileges.js).
      BAKE_BASE_URL: ${BAKE_BASE_URL:-}
      TECHMARINE_ROLE_ID: ${TECHMARINE_ROLE_ID:-}
      MECHADENDRITE_ROLE_ID: ${MECHADENDRITE_ROLE_ID:-}
      FORGE_ROLE_ID: ${FORGE_ROLE_ID:-}
      HIERARCHY_ROLE_ID: ${HIERARCHY_ROLE_ID:-}
      # Deathwatch area. No defaults anywhere: until both are set it answers 503.
      DEATHWATCH_ROLE_ID: ${DEATHWATCH_ROLE_ID:-}
      WATCH_COMMANDER_ROLE_ID: ${WATCH_COMMANDER_ROLE_ID:-}
      # Optional: the Deathwatch Command role (it shows the Watch Command tab). Unset, nobody is Deathwatch Command.
      DEATHWATCH_COMMAND_ROLE_ID: ${DEATHWATCH_COMMAND_ROLE_ID:-}
      EMISSARY_ROLE_ID: ${EMISSARY_ROLE_ID:-}
      XENOSBANE_SIGIL_ROLE_ID: ${XENOSBANE_SIGIL_ROLE_ID:-}
      VIGILIA_MORTIS_ROLE_ID: ${VIGILIA_MORTIS_ROLE_ID:-}
      KILL_MARINE_ROLE_ID: ${KILL_MARINE_ROLE_ID:-}
      # Reliquarium (members-only art and clips galleries). No defaults anywhere: until the clips channel
      # and all four R2 values are set, every /gallery route answers 503 and the clips poll does not start.
      GALLERY_CHANNEL_ID: ${GALLERY_CHANNEL_ID:-}
      # Optional: the curator role, one more approver. Unset, nobody is curator.
      GALLERY_CURATOR_ROLE_ID: ${GALLERY_CURATOR_ROLE_ID:-}
      # Optional: how often the clips channel is polled, in ms. Empty means 120000.
      GALLERY_POLL_MS: ${GALLERY_POLL_MS:-}
      # The private R2 bucket and an API token scoped to it alone. The secret is server/.env only.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # For the e2e stack's mock R2 only. Leave unset in production: empty means Cloudflare's endpoint.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    ports:
      - '8787:8787'

volumes:
  db-data:
